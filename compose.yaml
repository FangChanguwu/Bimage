services:
  api:
    build: .
    image: "${BIMAGE_API_IMAGE:-bimage-panel-api:0.3.3}"
    container_name: Bimage-panel-api
    restart: unless-stopped
    environment:
      PORT: "6768"
      DATA_DIR: /app/data
      BIMAGE_PUBLIC_URL: "${BIMAGE_PUBLIC_URL:-http://localhost:6767}"
      CONCURRENCY: "${BIMAGE_CONCURRENCY:-8}"
      COOKIE_SECURE: "${BIMAGE_COOKIE_SECURE:-false}"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    mem_limit: 512m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6768/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: "${BIMAGE_WEB_IMAGE:-bimage-panel-web:0.3.3}"
    container_name: Bimage-panel
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIMAGE_BIND_HOST:-0.0.0.0}:${BIMAGE_PORT:-6767}:6767"
    user: "101:101"
    read_only: true
    tmpfs: ["/tmp:size=16m,uid=101,gid=101", "/var/cache/nginx:size=16m,uid=101,gid=101", "/var/run:size=1m,uid=101,gid=101"]
    mem_limit: 96m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:6767/health"]
      interval: 10s
      timeout: 5s
      retries: 3
