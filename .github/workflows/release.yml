name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Typecheck & build
        run: |
          npm run typecheck
          npm run build

      - name: Pack release bundle
        run: node scripts/pack-release.mjs

      - name: Extract changelog notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          node -e '
            const fs = require("node:fs");
            const ver = process.argv[1];
            const log = fs.readFileSync("CHANGELOG.md", "utf8").replace(/\r\n/g, "\n");
            const esc = ver.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const m = log.match(new RegExp(`(?:^|\\n)## ${esc}[^\\n]*\\n([\\s\\S]*?)(?=\\n## |$)`));
            fs.writeFileSync("release-notes.md", (m ? m[1].trim() : `Bimage ${ver}`) + "\n", "utf8");
          ' "$VER"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-artifacts/bimage-*.tar.gz
            release-artifacts/checksums.txt
