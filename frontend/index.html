<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <script>
    // Capture and remove the secret before any application resources load.
    (() => {
      const url = new URL(window.location.href);
      let token = url.searchParams.get('setup_token') || '';
      if (url.searchParams.has('setup_token')) {
        url.searchParams.delete('setup_token');
        history.replaceState(history.state, '', url.pathname + url.search + url.hash);
      }
      if (!/^[A-Za-z0-9_-]{43}$/.test(token)) token = '';
      window.__bimageTakeSetupToken = () => {
        const value = token;
        token = '';
        return value;
      };
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f6f9">
  <link rel="icon" href="/Bimage.png">
  <title>Bimage</title>
</head>
<body><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>
