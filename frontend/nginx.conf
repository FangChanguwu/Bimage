# Do not record query credentials or Referer in access logs.
log_format bimage '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 6767;
    server_name _;
    access_log /var/log/nginx/access.log bimage;
    add_header Referrer-Policy "no-referrer" always;
    client_max_body_size 24m;
    # Optional Compose config: trust only the exact, private ingress socket peer.
    real_ip_header X-Real-IP;
    real_ip_recursive off;
    include /etc/nginx/conf.d/bimage-ingress*.inc;
    location = /health {
        proxy_pass http://api:6768/health;
        proxy_set_header Host $http_host;
    }
    location ^~ /api/agent/ {
        proxy_pass http://api:6768;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://api:6768;
        proxy_set_header Host $http_host;
        # Overwrite, never pass through a client-supplied address or chain.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_read_timeout 130s;
    }
}
